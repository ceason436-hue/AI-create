<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" fill="none">
  <title>AI创作五步循环</title><desc>观察、描述、生成、判断与修改的创作过程。</desc>
  <rect width="1200" height="520" fill="#F8FAFE"/>
  <path d="M128 252H1070" stroke="#C9D2E9" stroke-width="2"/><path d="M1066 245L1080 252L1066 259" stroke="#F05A24" stroke-width="3"/>
  <g font-family="Arial, Microsoft YaHei" text-anchor="middle">
    <g transform="translate(160 252)"><circle r="72" fill="white" stroke="#1D2F82"/><text y="-6" fill="#F05A24" font-size="18" font-weight="700">01</text><text y="29" fill="#1D2F82" font-size="27" font-weight="700">观察</text><text y="116" fill="#68738E" font-size="16">先看清对象与目标</text></g>
    <g transform="translate(380 252)"><circle r="72" fill="white" stroke="#1D2F82"/><text y="-6" fill="#F05A24" font-size="18" font-weight="700">02</text><text y="29" fill="#1D2F82" font-size="27" font-weight="700">描述</text><text y="116" fill="#68738E" font-size="16">把想法写成明确要求</text></g>
    <g transform="translate(600 252)"><circle r="82" fill="#1D2F82"/><text y="-6" fill="#FF7A42" font-size="18" font-weight="700">03</text><text y="29" fill="white" font-size="27" font-weight="700">生成</text><text y="126" fill="#68738E" font-size="16">形成第一版草稿</text></g>
    <g transform="translate(820 252)"><circle r="72" fill="white" stroke="#1D2F82"/><text y="-6" fill="#F05A24" font-size="18" font-weight="700">04</text><text y="29" fill="#1D2F82" font-size="27" font-weight="700">判断</text><text y="116" fill="#68738E" font-size="16">比较结果并说明选择</text></g>
    <g transform="translate(1040 252)"><circle r="72" fill="#F05A24"/><text y="-6" fill="white" font-size="18" font-weight="700">05</text><text y="29" fill="white" font-size="27" font-weight="700">修改</text><text y="116" fill="#68738E" font-size="16">继续调整直到完成表达</text></g>
  </g>
  <path d="M1040 160C1040 54 160 54 160 160" stroke="#1D2F82" stroke-opacity=".28" stroke-dasharray="6 9"/><text x="600" y="72" text-anchor="middle" fill="#1D2F82" font-family="Arial, Microsoft YaHei" font-size="17">每次生成都是可继续修改的草稿</text>
</svg>
