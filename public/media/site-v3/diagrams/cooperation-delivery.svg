<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <title>校园合作实施链路</title><desc>需求沟通、课程配置、空间与器材、教师协同、课堂实施和阶段复盘。</desc>
  <rect width="1200" height="560" fill="#F8FAFE"/>
  <path d="M100 282H1100" stroke="#1D2F82" stroke-opacity=".22" stroke-width="2"/><g font-family="Arial, Microsoft YaHei" text-anchor="middle">
    <g transform="translate(110 282)"><circle r="58" fill="#F05A24"/><text y="7" fill="white" font-size="22" font-weight="700">需求沟通</text><text y="104" fill="#68738E" font-size="16">年级 · 课时 · 目标</text></g>
    <g transform="translate(306 282)"><circle r="58" fill="white" stroke="#1D2F82"/><text y="7" fill="#1D2F82" font-size="22" font-weight="700">课程配置</text><text y="104" fill="#68738E" font-size="16">方向与课程梯度</text></g>
    <g transform="translate(502 282)"><circle r="58" fill="white" stroke="#1D2F82"/><text y="-4" fill="#1D2F82" font-size="22" font-weight="700">空间</text><text y="25" fill="#1D2F82" font-size="22" font-weight="700">与器材</text><text y="104" fill="#68738E" font-size="16">按项目准备</text></g>
    <g transform="translate(698 282)"><circle r="58" fill="white" stroke="#1D2F82"/><text y="7" fill="#1D2F82" font-size="22" font-weight="700">教师协同</text><text y="104" fill="#68738E" font-size="16">目标与课堂组织</text></g>
    <g transform="translate(894 282)"><circle r="58" fill="#1D2F82"/><text y="7" fill="white" font-size="22" font-weight="700">课堂实施</text><text y="104" fill="#68738E" font-size="16">搭建 · 编程 · 表达</text></g>
    <g transform="translate(1090 282)"><circle r="58" fill="white" stroke="#F05A24"/><text y="7" fill="#1D2F82" font-size="22" font-weight="700">阶段复盘</text><text y="104" fill="#68738E" font-size="16">记录与迭代</text></g>
  </g>
