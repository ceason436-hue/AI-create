<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" fill="none">
  <title>课程咨询决策图</title><desc>根据年级、兴趣和学习目标选择课程方向与体验方式。</desc>
  <rect width="1200" height="620" fill="#F8FAFE"/>
  <g font-family="Arial, Microsoft YaHei"><rect x="70" y="220" width="220" height="180" fill="white" stroke="#1D2F82"/><text x="180" y="270" text-anchor="middle" fill="#F05A24" font-size="17" font-weight="700">STEP 01</text><text x="180" y="315" text-anchor="middle" fill="#1D2F82" font-size="30" font-weight="700">了解孩子</text><text x="180" y="352" text-anchor="middle" fill="#68738E" font-size="17">年级 · 兴趣 · 目标</text>
    <path d="M290 310H382" stroke="#1D2F82" stroke-width="2"/><path d="M370 300L382 310L370 320" stroke="#F05A24" stroke-width="3"/>
    <g transform="translate(410 82)"><text x="0" y="0" fill="#F05A24" font-size="17" font-weight="700">STEP 02 · 找到方向</text><g font-size="20" font-weight="700" fill="#1D2F82"><rect y="30" width="230" height="84" fill="white" stroke="#D3DAEB"/><text x="115" y="82" text-anchor="middle">逻辑与控制</text><rect y="132" width="230" height="84" fill="white" stroke="#D3DAEB"/><text x="115" y="184" text-anchor="middle">空间与造物</text><rect y="234" width="230" height="84" fill="white" stroke="#D3DAEB"/><text x="115" y="286" text-anchor="middle">智能观察与创意</text><rect y="336" width="230" height="84" fill="white" stroke="#D3DAEB"/><text x="115" y="388" text-anchor="middle">飞行与机器人</text><rect y="438" width="230" height="84" fill="white" stroke="#D3DAEB"/><text x="115" y="490" text-anchor="middle">跨学科科创</text></g></g>
    <path d="M660 310H752" stroke="#1D2F82" stroke-width="2"/><path d="M740 300L752 310L740 320" stroke="#F05A24" stroke-width="3"/>
    <rect x="780" y="168" width="350" height="284" fill="#1D2F82"/><text x="955" y="216" text-anchor="middle" fill="#FF7A42" font-size="17" font-weight="700">STEP 03</text><text x="955" y="264" text-anchor="middle" fill="white" font-size="30" font-weight="700">先体验，再决定</text><text x="824" y="318" fill="white" font-size="18">01 选择合适的体验主题</text><text x="824" y="358" fill="white" font-size="18">02 观察投入方式与动手过程</text><text x="824" y="398" fill="white" font-size="18">03 沟通长期课程建议</text>
  </g>
</svg>
